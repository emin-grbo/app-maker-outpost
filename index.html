<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bunker fog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      overflow: hidden;
    }
    .container {
      text-align: center;
      z-index: 1;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      margin-bottom: 0.5rem;
      color: #f0f0f0;
      transition: opacity 0.25s ease;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.2em;
      margin-bottom: 3rem;
      min-height: 1.2em;
      max-width: 32rem;
      margin-left: auto;
      margin-right: auto;
      transition: opacity 0.25s ease;
    }
    .container.switching h1,
    .container.switching .subtitle {
      opacity: 0.25;
    }
    .transport {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      margin-bottom: 2rem;
    }
    .skip-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }
    .skip-btn svg {
      width: 20px;
      height: 20px;
      fill: #555;
      transition: fill 0.3s;
    }
    .skip-btn:hover svg { fill: #aaa; }
    .skip-btn:hover { background: rgba(255,255,255,0.03); }
    .skip-btn:disabled { cursor: default; }
    .skip-btn:disabled svg { fill: #2a2a2a; }
    .skip-btn:disabled:hover { background: transparent; }
    .track-count {
      font-size: 0.65rem;
      color: #3a3a3a;
      letter-spacing: 0.25em;
      margin-top: 0.75rem;
    }
    #play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #444;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    #play-btn:hover {
      border-color: #888;
      background: rgba(255,255,255,0.03);
    }
    #play-btn.playing {
      border-color: #6cf;
      box-shadow: 0 0 20px rgba(102, 204, 255, 0.15);
    }
    #play-btn svg {
      width: 24px;
      height: 24px;
      fill: #ccc;
      transition: fill 0.3s;
    }
    #play-btn.playing svg {
      fill: #6cf;
    }
    .status {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.15em;
    }
    .status.active {
      color: #6cf;
    }
    /* Strudel editor - in viewport, near-invisible (Safari kills off-screen audio) */
    #strudel-host {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
      z-index: -1;
    }
    #debug {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 30vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.9);
      border-top: 1px solid #333;
      padding: 0.5rem;
      font-size: 0.65rem;
      color: #999;
      font-family: monospace;
    }
    #debug .err { color: #f66; }
    #debug .warn { color: #fc6; }
    #debug .info { color: #6cf; }
    /* background ambient effect */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(102,204,255,0.03) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }
    .bg-glow.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="bg-glow" id="bg-glow"></div>
  <div class="container">
    <h1 id="song-title">bunker fog</h1>
    <p class="subtitle" id="song-blurb">generative ambient</p>
    <div class="transport">
      <button id="prev-btn" class="skip-btn" aria-label="Previous track">
        <svg viewBox="0 0 24 24">
          <polygon points="18,5 8,12 18,19"/>
          <rect x="5" y="5" width="2" height="14"/>
        </svg>
      </button>
      <button id="play-btn" aria-label="Play">
        <svg id="play-icon" viewBox="0 0 24 24">
          <polygon points="6,4 20,12 6,20"/>
        </svg>
      </button>
      <button id="next-btn" class="skip-btn" aria-label="Next track">
        <svg viewBox="0 0 24 24">
          <polygon points="6,5 16,12 6,19"/>
          <rect x="17" y="5" width="2" height="14"/>
        </svg>
      </button>
    </div>
    <p class="status" id="status">click to listen</p>
    <p class="track-count" id="track-count"></p>
  </div>

  <div id="strudel-host"></div>
  <div id="debug"></div>

  <script>
    // -----------------------------------------------------------------------
    // Worker-driven setInterval/clearInterval — must run BEFORE @strudel/repl.
    // Strudel's Cyclist (packages/core/zyklus.mjs) defaults to
    //   setInterval = globalThis.setInterval
    // which Safari throttles/pauses in background tabs. Web Worker timers keep
    // ticking when the tab is hidden. strudel.cc does the same via the
    // `worker-timers` npm package; we inline the equivalent here so playback
    // continues in background Safari tabs.
    // -----------------------------------------------------------------------
    (function installWorkerTimers() {
      const src = `
        const timers = new Map();
        self.onmessage = (e) => {
          const { id, action, delay } = e.data;
          if (action === 'set') {
            const nid = setInterval(() => self.postMessage(id), delay);
            timers.set(id, nid);
          } else if (action === 'clear') {
            const nid = timers.get(id);
            if (nid !== undefined) { clearInterval(nid); timers.delete(id); }
          }
        };
      `;
      let worker;
      try {
        worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'application/javascript' })));
      } catch (e) {
        console.warn('[worker-timers] Worker unavailable, keeping native setInterval', e);
        return;
      }
      const callbacks = new Map();
      let nextId = 1;
      worker.onmessage = (e) => {
        const cb = callbacks.get(e.data);
        if (cb) cb();
      };
      const nativeSetInterval = window.setInterval;
      const nativeClearInterval = window.clearInterval;
      window.setInterval = function (callback, delay) {
        if (typeof callback !== 'function') {
          // Strings, missing delay, etc. — fall back to native
          return nativeSetInterval.apply(window, arguments);
        }
        const id = nextId++;
        callbacks.set(id, callback);
        worker.postMessage({ id, action: 'set', delay: delay || 0 });
        return id;
      };
      window.clearInterval = function (id) {
        if (callbacks.has(id)) {
          callbacks.delete(id);
          worker.postMessage({ id, action: 'clear' });
        } else {
          nativeClearInterval.call(window, id);
        }
      };
      console.log('[worker-timers] installed — setInterval now runs off a Web Worker');
    })();
  </script>

  <script src="https://unpkg.com/@strudel/repl@latest"></script>
  <script>
    // Debug logger
    const debugEl = document.getElementById('debug');
    function log(msg, level = 'info') {
      const line = document.createElement('div');
      line.className = level;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      debugEl.appendChild(line);
      debugEl.scrollTop = debugEl.scrollHeight;
      console[level === 'err' ? 'error' : level === 'warn' ? 'warn' : 'log'](msg);
    }

    window.addEventListener('error', (e) => log(`UNCAUGHT: ${e.message} (${e.filename}:${e.lineno})`, 'err'));
    window.addEventListener('unhandledrejection', (e) => log(`UNHANDLED PROMISE: ${e.reason}`, 'err'));

    let isPlaying = false;
    let repl = null;
    let currentAudioCtx = null;
    const trackedContexts = new WeakSet();
    const container = document.querySelector('.container');
    const btn = document.getElementById('play-btn');
    const icon = document.getElementById('play-icon');
    const status = document.getElementById('status');
    const glow = document.getElementById('bg-glow');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const titleEl = document.getElementById('song-title');
    const blurbEl = document.getElementById('song-blurb');
    const countEl = document.getElementById('track-count');

    const playPath = '<polygon points="6,4 20,12 6,20"/>';
    const pausePath = '<rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/>';

    // -----------------------------------------------------------------------
    // Track list. songs.json is generated from each .strudel file's header
    // comment (title + one-line scene blurb). Falls back to bunkerfog alone so
    // the page still plays if the manifest is missing.
    // -----------------------------------------------------------------------
    const FALLBACK_SONGS = [
      { file: 'bunkerfog.strudel', title: 'bunker fog', blurb: 'generative ambient' },
    ];
    let songs = FALLBACK_SONGS;
    let currentIndex = 0;
    let loadedIndex = -1;   // which track's code the REPL currently holds
    let switchToken = 0;    // guards against out-of-order track switches

    async function loadManifest() {
      try {
        const res = await fetch(`songs.json?v=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const list = await res.json();
        if (!Array.isArray(list) || !list.length) throw new Error('manifest empty');
        songs = list;
        const start = songs.findIndex((s) => s.file === 'bunkerfog.strudel');
        currentIndex = start === -1 ? 0 : start;
        log(`Manifest loaded (${songs.length} tracks)`);
      } catch (e) {
        log(`songs.json unavailable (${e.message}) — using fallback`, 'warn');
      }
      renderSong();
    }

    function renderSong() {
      const song = songs[currentIndex];
      titleEl.textContent = song.title;
      blurbEl.textContent = song.blurb || 'generative ambient';
      countEl.textContent = songs.length > 1
        ? `${String(currentIndex + 1).padStart(2, '0')} / ${String(songs.length).padStart(2, '0')}`
        : '';
      document.title = song.title;
      const single = songs.length < 2;
      prevBtn.disabled = single;
      nextBtn.disabled = single;
      if ('mediaSession' in navigator && navigator.mediaSession.metadata) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: song.title,
            artist: 'generative ambient',
          });
        } catch (e) { /* metadata refresh is best-effort */ }
      }
    }

    async function fetchCode(file) {
      const response = await fetch(`${file}?v=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) {
        log(`Fetch failed: ${response.status} ${response.statusText}`, 'err');
        throw new Error(`Fetch failed: ${response.status}`);
      }
      return response.text();
    }

    async function setupRepl() {
      if (repl) return;
      const song = songs[currentIndex];
      log(`Fetching ${song.file}...`);
      const code = await fetchCode(song.file);
      log(`Code loaded (${code.length} chars)`);

      log('Creating strudel-editor...');
      repl = document.createElement('strudel-editor');
      repl.setAttribute('code', code);
      document.getElementById('strudel-host').append(repl);

      // Wait for the editor instance to be ready
      await new Promise((resolve, reject) => {
        let tries = 0;
        const check = () => {
          if (repl.editor) return resolve();
          if (++tries > 100) return reject(new Error('strudel editor never initialized'));
          setTimeout(check, 100);
        };
        check();
      });
      loadedIndex = currentIndex;
      log('Strudel REPL ready');
    }

    // Push a track's code into an already-built REPL.
    async function swapCode(index) {
      const song = songs[index];
      log(`Loading ${song.file}...`);
      const code = await fetchCode(song.file);
      if (typeof repl.editor.setCode === 'function') {
        repl.editor.setCode(code);
      } else {
        // Older builds expose the CodeMirror doc directly
        repl.editor.repl?.setCode?.(code);
        repl.setAttribute('code', code);
      }
      loadedIndex = index;
      log(`Code swapped (${code.length} chars)`);
    }

    async function selectSong(index) {
      const next = (index + songs.length) % songs.length;
      if (next === currentIndex) return;
      currentIndex = next;
      const token = ++switchToken;
      renderSong();

      if (!repl) return;   // nothing built yet — playAudio() will pick it up

      container.classList.add('switching');
      const wasPlaying = isPlaying;
      if (wasPlaying) status.textContent = 'switching...';
      try {
        await swapCode(currentIndex);
        if (token !== switchToken) return;   // superseded by a newer skip
        if (wasPlaying) {
          await repl.editor.evaluate();
          await resumeAllAudioContexts();
          status.textContent = 'playing';
          log('Switched track while playing');
        }
      } catch (e) {
        log(`Track switch failed: ${e.message}`, 'err');
        if (token === switchToken) status.textContent = 'error - see debug below';
      } finally {
        if (token === switchToken) container.classList.remove('switching');
      }
    }

    // Attach a one-time state listener so a suspended context auto-resumes while playing
    function trackContext(ctx) {
      if (!ctx || trackedContexts.has(ctx)) return;
      trackedContexts.add(ctx);
      currentAudioCtx = ctx;
      ctx.addEventListener('statechange', async () => {
        log(`AudioContext state -> ${ctx.state}`);
        if (isPlaying && (ctx.state === 'suspended' || ctx.state === 'interrupted')) {
          try {
            await ctx.resume();
            log(`Auto-resumed -> ${ctx.state}`);
          } catch (e) {
            log(`Auto-resume failed: ${e.message}`, 'err');
          }
        }
      });
    }

    // Find and resume all AudioContexts on the page (Safari keeps them suspended)
    async function resumeAllAudioContexts() {
      // Method 1: Check Strudel's internal getAudioContext if exposed
      const methods = [
        () => repl?.editor?.repl?.scheduler?.audioContext,
        () => repl?.editor?.repl?.audioContext,
        () => repl?.editor?.audioContext,
        () => document.querySelector('strudel-editor')?.editor?.repl?.scheduler?.audioContext,
      ];
      
      let found = 0;
      for (const getter of methods) {
        try {
          const ctx = getter();
          if (ctx && ctx.state) {
            found++;
            log(`Found ctx via internal API (state: ${ctx.state})`);
            trackContext(ctx);
            if (ctx.state !== 'running') {
              await ctx.resume();
              log(`Resumed -> ${ctx.state}`);
            }
          }
        } catch(e) {}
      }

      // Method 2: Try getAudioContext global (Strudel sometimes exposes this)
      if (window.getAudioContext) {
        try {
          const ctx = window.getAudioContext();
          if (ctx) {
            found++;
            log(`Found ctx via getAudioContext() (state: ${ctx.state})`);
            trackContext(ctx);
            if (ctx.state !== 'running') {
              await ctx.resume();
              log(`Resumed -> ${ctx.state}`);
            }
          }
        } catch(e) {}
      }

      if (found === 0) {
        log('No AudioContext found via known paths', 'warn');
      }
      return found;
    }

    async function playAudio() {
      if (isPlaying) return;
      try {
        status.textContent = 'loading...';
        await setupRepl();
        if (loadedIndex !== currentIndex) await swapCode(currentIndex);

        log('Starting playback...');
        // Use start() which handles AudioContext creation + resume internally
        if (repl.editor.start) {
          await repl.editor.start();
          log('editor.start() called');
        }
        await repl.editor.evaluate();
        log('editor.evaluate() called');

        // Resume contexts immediately (still in user gesture callstack)
        await resumeAllAudioContexts();

        // Delayed retry - catch lazy context creation
        setTimeout(async () => {
          const n = await resumeAllAudioContexts();
          log(`Delayed resume check: ${n} context(s) found`);
        }, 1000);

        // Another retry at 3s for slow sample loading
        setTimeout(async () => {
          await resumeAllAudioContexts();
        }, 3000);

        isPlaying = true;
        btn.classList.add('playing');
        icon.innerHTML = pausePath;
        status.textContent = 'playing';
        status.classList.add('active');
        glow.classList.add('active');
        log('Playback started');

        // Media Session — signals to Safari this tab is a media player + adds OS media controls
        if ('mediaSession' in navigator) {
          try {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: songs[currentIndex].title,
              artist: 'generative ambient',
            });
            navigator.mediaSession.playbackState = 'playing';
            navigator.mediaSession.setActionHandler('play', () => playAudio());
            navigator.mediaSession.setActionHandler('pause', () => stopAudio());
            navigator.mediaSession.setActionHandler('previoustrack', () => selectSong(currentIndex - 1));
            navigator.mediaSession.setActionHandler('nexttrack', () => selectSong(currentIndex + 1));
            log('MediaSession registered');
          } catch (e) {
            log(`MediaSession setup failed: ${e.message}`, 'warn');
          }
        }
      } catch (e) {
        log(`Play error: ${e.message}`, 'err');
        status.textContent = 'error - see debug below';
      }
    }

    function stopAudio() {
      if (!isPlaying) return;
      repl.editor.stop();
      isPlaying = false;
      btn.classList.remove('playing');
      icon.innerHTML = playPath;
      status.textContent = 'click to listen';
      status.classList.remove('active');
      glow.classList.remove('active');
      log('Stopped');
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'paused';
      }
    }

    btn.addEventListener('click', () => {
      if (isPlaying) stopAudio(); else playAudio();
    });
    prevBtn.addEventListener('click', () => selectSong(currentIndex - 1));
    nextBtn.addEventListener('click', () => selectSong(currentIndex + 1));

    document.addEventListener('keydown', (e) => {
      if (e.target.closest('#strudel-host')) return;   // don't hijack the editor
      if (e.key === 'ArrowRight') { e.preventDefault(); selectSong(currentIndex + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); selectSong(currentIndex - 1); }
      else if (e.key === ' ') { e.preventDefault(); isPlaying ? stopAudio() : playAudio(); }
    });

    // Safari suspends background tabs — resume when tab/window becomes active again
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && isPlaying) {
        log('Tab visible — verifying audio context…');
        await resumeAllAudioContexts();
      }
    });
    window.addEventListener('focus', async () => {
      if (isPlaying) {
        log('Window focused — verifying audio context…');
        await resumeAllAudioContexts();
      }
    });

    loadManifest();
  </script>
</body>
</html>
