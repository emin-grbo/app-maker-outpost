<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bunker fog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      overflow: hidden;
    }
    .container {
      text-align: center;
      z-index: 1;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      margin-bottom: 0.5rem;
      color: #f0f0f0;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.2em;
      margin-bottom: 3rem;
    }
    #play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #444;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      transition: all 0.3s ease;
    }
    #play-btn:hover {
      border-color: #888;
      background: rgba(255,255,255,0.03);
    }
    #play-btn.playing {
      border-color: #6cf;
      box-shadow: 0 0 20px rgba(102, 204, 255, 0.15);
    }
    #play-btn svg {
      width: 24px;
      height: 24px;
      fill: #ccc;
      transition: fill 0.3s;
    }
    #play-btn.playing svg {
      fill: #6cf;
    }
    .status {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.15em;
    }
    .status.active {
      color: #6cf;
    }
    /* Hide the strudel editor completely */
    strudel-editor {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
    /* background ambient effect */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(102,204,255,0.03) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }
    .bg-glow.active {
      opacity: 1;
    }
    #debug {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 30vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.9);
      border-top: 1px solid #333;
      padding: 0.5rem;
      font-size: 0.65rem;
      color: #999;
      font-family: monospace;
    }
    #debug .err { color: #f66; }
    #debug .warn { color: #fc6; }
    #debug .info { color: #6cf; }
  </style>
</head>
<body>
  <div class="bg-glow" id="bg-glow"></div>
  <div class="container">
    <h1>bunker fog</h1>
    <p class="subtitle">generative ambient</p>
    <button id="play-btn" aria-label="Play">
      <svg id="play-icon" viewBox="0 0 24 24">
        <polygon points="6,4 20,12 6,20"/>
      </svg>
    </button>
    <p class="status" id="status">click to listen</p>
  </div>

  <!-- Hidden strudel-editor handles audio scheduling properly -->
  <script src="https://unpkg.com/@strudel/repl@latest"></script>
  <strudel-editor id="strudel">

  </strudel-editor>

  <div id="debug"></div>

  <script>
    const debugEl = document.getElementById('debug');
    function log(msg, level = 'info') {
      const line = document.createElement('div');
      line.className = level;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      debugEl.appendChild(line);
      debugEl.scrollTop = debugEl.scrollHeight;
    }

    window.addEventListener('error', (e) => log(`UNCAUGHT: ${e.message}`, 'err'));
    window.addEventListener('unhandledrejection', (e) => log(`UNHANDLED: ${e.reason}`, 'err'));

    let isPlaying = false;
    const btn = document.getElementById('play-btn');
    const icon = document.getElementById('play-icon');
    const status = document.getElementById('status');
    const glow = document.getElementById('bg-glow');
    const strudelEl = document.getElementById('strudel');

    const playPath = '<polygon points="6,4 20,12 6,20"/>';
    const pausePath = '<rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/>';

    btn.addEventListener('click', async () => {
      if (!isPlaying) {
        log('Starting playback via strudel-editor...');
        try {
          // strudel-editor exposes play/stop via its shadow DOM button or programmatic API
          const playButton = strudelEl.shadowRoot?.querySelector('button[aria-label="play"]')
            || strudelEl.shadowRoot?.querySelector('button')
            || strudelEl.querySelector('button');
          
          if (playButton) {
            playButton.click();
            log('Clicked strudel internal play button');
          } else {
            // Fallback: try dispatching keyboard shortcut (Ctrl+Enter triggers eval in strudel)
            log('No play button found in shadowRoot, trying alternate methods...', 'warn');
            // List what's in shadow root for debugging
            const sr = strudelEl.shadowRoot;
            if (sr) {
              log(`Shadow root children: ${sr.children.length}, innerHTML preview: ${sr.innerHTML.substring(0, 200)}`);
            } else {
              log('No shadow root found', 'warn');
            }
          }

          isPlaying = true;
          btn.classList.add('playing');
          icon.innerHTML = pausePath;
          status.textContent = 'playing';
          status.classList.add('active');
          glow.classList.add('active');
        } catch (e) {
          log(`Error: ${e.message}`, 'err');
          status.textContent = 'error - see debug';
        }
      } else {
        // Stop
        const stopButton = strudelEl.shadowRoot?.querySelector('button[aria-label="stop"]')
          || strudelEl.shadowRoot?.querySelectorAll('button')?.[1];
        if (stopButton) stopButton.click();
        
        isPlaying = false;
        btn.classList.remove('playing');
        icon.innerHTML = playPath;
        status.textContent = 'click to listen';
        status.classList.remove('active');
        glow.classList.remove('active');
        log('Stopped');
      }
    });
  </script>
</body>
</html>
