<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bunker fog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      overflow: hidden;
    }
    .container {
      text-align: center;
      z-index: 1;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      margin-bottom: 0.5rem;
      color: #f0f0f0;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.2em;
      margin-bottom: 3rem;
    }
    #play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #444;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      transition: all 0.3s ease;
    }
    #play-btn:hover {
      border-color: #888;
      background: rgba(255,255,255,0.03);
    }
    #play-btn.playing {
      border-color: #6cf;
      box-shadow: 0 0 20px rgba(102, 204, 255, 0.15);
    }
    #play-btn svg {
      width: 24px;
      height: 24px;
      fill: #ccc;
      transition: fill 0.3s;
    }
    #play-btn.playing svg {
      fill: #6cf;
    }
    .status {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.15em;
    }
    .status.active {
      color: #6cf;
    }
    /* Hidden strudel editor - handles all audio, never visible */
    #strudel-host {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
    #debug {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 30vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.9);
      border-top: 1px solid #333;
      padding: 0.5rem;
      font-size: 0.65rem;
      color: #999;
      font-family: monospace;
    }
    #debug .err { color: #f66; }
    #debug .warn { color: #fc6; }
    #debug .info { color: #6cf; }
    /* background ambient effect */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(102,204,255,0.03) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }
    .bg-glow.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="bg-glow" id="bg-glow"></div>
  <div class="container">
    <h1>bunker fog</h1>
    <p class="subtitle">generative ambient</p>
    <button id="play-btn" aria-label="Play">
      <svg id="play-icon" viewBox="0 0 24 24">
        <polygon points="6,4 20,12 6,20"/>
      </svg>
    </button>
    <p class="status" id="status">click to listen</p>
  </div>

  <div id="strudel-host"></div>
  <div id="debug"></div>

  <script src="https://unpkg.com/@strudel/repl@latest"></script>
  <script>
    // Debug logger
    const debugEl = document.getElementById('debug');
    function log(msg, level = 'info') {
      const line = document.createElement('div');
      line.className = level;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      debugEl.appendChild(line);
      debugEl.scrollTop = debugEl.scrollHeight;
      console[level === 'err' ? 'error' : level === 'warn' ? 'warn' : 'log'](msg);
    }

    window.addEventListener('error', (e) => log(`UNCAUGHT: ${e.message} (${e.filename}:${e.lineno})`, 'err'));
    window.addEventListener('unhandledrejection', (e) => log(`UNHANDLED PROMISE: ${e.reason}`, 'err'));

    let isPlaying = false;
    let repl = null;
    const btn = document.getElementById('play-btn');
    const icon = document.getElementById('play-icon');
    const status = document.getElementById('status');
    const glow = document.getElementById('bg-glow');

    const playPath = '<polygon points="6,4 20,12 6,20"/>';
    const pausePath = '<rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/>';

    async function setupRepl() {
      if (repl) return;
      log('Fetching bunkerfog.strudel...');
      const response = await fetch('bunkerfog.strudel');
      if (!response.ok) {
        log(`Fetch failed: ${response.status} ${response.statusText}`, 'err');
        throw new Error(`Fetch failed: ${response.status}`);
      }
      const code = await response.text();
      log(`Code loaded (${code.length} chars)`);

      log('Creating hidden strudel-editor...');
      repl = document.createElement('strudel-editor');
      repl.setAttribute('code', code);
      document.getElementById('strudel-host').append(repl);

      // Wait for the editor instance to be ready
      await new Promise((resolve, reject) => {
        let tries = 0;
        const check = () => {
          if (repl.editor) return resolve();
          if (++tries > 100) return reject(new Error('strudel editor never initialized'));
          setTimeout(check, 100);
        };
        check();
      });
      log('Strudel REPL ready');
    }

    btn.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          status.textContent = 'loading...';
          await setupRepl();
          log('Starting playback (editor.evaluate)...');
          await repl.editor.evaluate();
          isPlaying = true;
          btn.classList.add('playing');
          icon.innerHTML = pausePath;
          status.textContent = 'playing';
          status.classList.add('active');
          glow.classList.add('active');
          log('Playback started');
        } catch (e) {
          log(`Play error: ${e.message}`, 'err');
          status.textContent = 'error - see debug below';
        }
      } else {
        repl.editor.stop();
        isPlaying = false;
        btn.classList.remove('playing');
        icon.innerHTML = playPath;
        status.textContent = 'click to listen';
        status.classList.remove('active');
        glow.classList.remove('active');
        log('Stopped');
      }
    });
  </script>
</body>
</html>
