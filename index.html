<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bunker fog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      overflow: hidden;
    }
    .container {
      text-align: center;
      z-index: 1;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      margin-bottom: 0.5rem;
      color: #f0f0f0;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.2em;
      margin-bottom: 3rem;
    }
    #play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #444;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      transition: all 0.3s ease;
    }
    #play-btn:hover {
      border-color: #888;
      background: rgba(255,255,255,0.03);
    }
    #play-btn.playing {
      border-color: #6cf;
      box-shadow: 0 0 20px rgba(102, 204, 255, 0.15);
    }
    #play-btn svg {
      width: 24px;
      height: 24px;
      fill: #ccc;
      transition: fill 0.3s;
    }
    #play-btn.playing svg {
      fill: #6cf;
    }
    .status {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.15em;
    }
    .status.active {
      color: #6cf;
    }
    /* background ambient effect */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(102,204,255,0.03) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }
    .bg-glow.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="bg-glow" id="bg-glow"></div>
  <div class="container">
    <h1>bunker fog</h1>
    <p class="subtitle">generative ambient</p>
    <button id="play-btn" aria-label="Play">
      <svg id="play-icon" viewBox="0 0 24 24">
        <polygon points="6,4 20,12 6,20"/>
      </svg>
    </button>
    <p class="status" id="status">click to listen</p>
  </div>

  <script src="https://unpkg.com/@strudel/web@latest"></script>
  <script>
    let isPlaying = false;
    const btn = document.getElementById('play-btn');
    const icon = document.getElementById('play-icon');
    const status = document.getElementById('status');
    const glow = document.getElementById('bg-glow');

    // Pause icon SVG
    const playPath = '<polygon points="6,4 20,12 6,20"/>';
    const pausePath = '<rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/>';

    let strudelReady = false;

    async function initPlayer() {
      if (!strudelReady) {
        status.textContent = 'loading...';
        await initStrudel({
          prebake: () => samples('github:emin-grbo/app-maker--outpost'),
        });
        strudelReady = true;
      }
    }

    async function loadAndPlay() {
      const response = await fetch('bunkerfog.strudel');
      const code = await response.text();
      await evaluate(code);
    }

    btn.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          await initPlayer();
          await loadAndPlay();
          isPlaying = true;
          btn.classList.add('playing');
          icon.innerHTML = pausePath;
          status.textContent = 'playing';
          status.classList.add('active');
          glow.classList.add('active');
        } catch (e) {
          console.error(e);
          status.textContent = 'error - check console';
        }
      } else {
        hush();
        isPlaying = false;
        btn.classList.remove('playing');
        icon.innerHTML = playPath;
        status.textContent = 'click to listen';
        status.classList.remove('active');
        glow.classList.remove('active');
      }
    });
  </script>
</body>
</html>
